{% extends "base.html" %}

{% block title %}Password Generator - Hare Krishna 🪷{% endblock %}

{% block content %}
<section class="page-header">
    <div class="page-header-content">
        <h1><i class="fas fa-key"></i> Password Generator</h1>
        <p>Generate secure random passwords</p>
    </div>
</section>

<section class="tool-page">
    <div class="tool-card">
        <div class="form-group">
            <label>Generated Password</label>
            <div class="password-output-wrap">
                <input type="text" id="password-output" readonly class="password-output">
                <button class="btn btn-ghost" onclick="pwCopy()">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
        </div>
        <div class="form-group">
            <label>Length: <span id="pw-len-val">16</span></label>
            <input type="range" id="pw-length" min="4" max="64" value="16" class="range-slider" oninput="document.getElementById('pw-len-val').textContent = this.value">
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" id="pw-upper" checked>
                <span>Uppercase (A-Z)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="pw-lower" checked>
                <span>Lowercase (a-z)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="pw-numbers" checked>
                <span>Numbers (0-9)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="pw-symbols">
                <span>Symbols (!@#$)</span>
            </label>
        </div>
        <button class="btn btn-primary btn-lg" onclick="pwGenerate()">
            <i class="fas fa-sync-alt"></i> Generate Password
        </button>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function pwGenerate() {
    const length = parseInt(document.getElementById('pw-length').value);
    const upper = document.getElementById('pw-upper').checked;
    const lower = document.getElementById('pw-lower').checked;
    const numbers = document.getElementById('pw-numbers').checked;
    const symbols = document.getElementById('pw-symbols').checked;

    let chars = '';
    if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (numbers) chars += '0123456789';
    if (symbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

    if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';

    let password = '';
    const array = new Uint32Array(length);
    window.crypto.getRandomValues(array);
    for (let i = 0; i < length; i++) {
        password += chars[array[i] % chars.length];
    }
    document.getElementById('password-output').value = password;
}

function pwCopy() {
    const out = document.getElementById('password-output');
    out.select();
    document.execCommand('copy');
}

// Generate on load
pwGenerate();
</script>
{% endblock %}
