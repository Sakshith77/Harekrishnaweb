{% extends "base.html" %}

{% block title %}Text Formatter - Hare Krishna 🪷{% endblock %}

{% block content %}
<section class="page-header">
    <div class="page-header-content">
        <h1><i class="fas fa-font"></i> Text Formatter</h1>
        <p>Format, clean, and transform text</p>
    </div>
</section>

<section class="tool-page">
    <div class="tool-card">
        <div class="form-group">
            <label>Input Text</label>
            <textarea id="text-input" rows="6" placeholder="Paste your text here..."></textarea>
        </div>
        <div class="tool-actions">
            <button class="btn btn-primary" onclick="textUpper()">
                <i class="fas fa-font"></i> UPPERCASE
            </button>
            <button class="btn btn-primary" onclick="textLower()">
                <i class="fas fa-font"></i> lowercase
            </button>
            <button class="btn btn-secondary" onclick="textCapitalize()">
                <i class="fas fa-heading"></i> Capitalize
            </button>
            <button class="btn btn-secondary" onclick="textRemoveExtra()">
                <i class="fas fa-eraser"></i> Remove Extra Spaces
            </button>
            <button class="btn btn-ghost" onclick="textReverse()">
                <i class="fas fa-undo"></i> Reverse
            </button>
            <button class="btn btn-ghost" onclick="textClear()">
                <i class="fas fa-trash"></i> Clear
            </button>
        </div>
        <div class="form-group">
            <label>Output</label>
            <textarea id="text-output" rows="6" readonly placeholder="Result will appear here..."></textarea>
        </div>
        <button class="btn btn-ghost" onclick="textCopy()">
            <i class="fas fa-copy"></i> Copy Result
        </button>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function getInput() { return document.getElementById('text-input').value; }
function setOutput(t) { document.getElementById('text-output').value = t; }
function textUpper() { setOutput(getInput().toUpperCase()); }
function textLower() { setOutput(getInput().toLowerCase()); }
function textCapitalize() {
    setOutput(getInput().toLowerCase().replace(/\b\w/g, c => c.toUpperCase()));
}
function textRemoveExtra() {
    setOutput(getInput().replace(/\s+/g, ' ').trim());
}
function textReverse() {
    setOutput(getInput().split('').reverse().join(''));
}
function textClear() {
    document.getElementById('text-input').value = '';
    document.getElementById('text-output').value = '';
}
function textCopy() {
    const out = document.getElementById('text-output');
    out.select();
    document.execCommand('copy');
}
</script>
{% endblock %}
