{% extends "base.html" %}

{% block title %}Color Picker - Hare Krishna 🪷{% endblock %}

{% block content %}
<section class="page-header">
    <div class="page-header-content">
        <h1><i class="fas fa-palette"></i> Color Picker</h1>
        <p>Pick, convert, and copy colors</p>
    </div>
</section>

<section class="tool-page">
    <div class="tool-card">
        <div class="color-picker-wrap">
            <input type="color" id="color-input" value="#5f27cd" class="color-native">
            <div class="color-preview" id="color-preview" style="background: #5f27cd;"></div>
        </div>
        <div class="form-group">
            <label>HEX</label>
            <div class="copy-field">
                <input type="text" id="color-hex" value="#5f27cd" readonly>
                <button onclick="copyField('color-hex')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
        <div class="form-group">
            <label>RGB</label>
            <div class="copy-field">
                <input type="text" id="color-rgb" value="rgb(95, 39, 205)" readonly>
                <button onclick="copyField('color-rgb')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
        <div class="form-group">
            <label>HSL</label>
            <div class="copy-field">
                <input type="text" id="color-hsl" value="hsl(263, 68%, 48%)" readonly>
                <button onclick="copyField('color-hsl')"><i class="fas fa-copy"></i></button>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return {r, g, b};
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    return {h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100)};
}

function updateColor() {
    const hex = document.getElementById('color-input').value;
    const rgb = hexToRgb(hex);
    const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);

    document.getElementById('color-preview').style.background = hex;
    document.getElementById('color-hex').value = hex;
    document.getElementById('color-rgb').value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    document.getElementById('color-hsl').value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
}

document.getElementById('color-input').addEventListener('input', updateColor);

function copyField(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand('copy');
}
</script>
{% endblock %}
